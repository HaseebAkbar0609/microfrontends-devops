image: node:20-alpine

pipelines:
  branches:
    dev:
      - step:
          name: Build & Push All Frontend Images to ECR
          services:
            - docker
          script:
            - apk add --no-cache curl

            - docker build -t timeflow-customer ./apps/customer
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: eu-north-1
                IMAGE_NAME: timeflow-customer

            - docker build -t timeflow-professional ./apps/professional
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: eu-north-1
                IMAGE_NAME: timeflow-professional

            - docker build -t timeflow-team ./apps/team
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: eu-north-1
                IMAGE_NAME: timeflow-team

            - docker build -t timeflow-landing-page ./apps/landing
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: eu-north-1
                IMAGE_NAME: timeflow-landing-page

      - step:
          name: Deploy to Dev Server
          script:
            - pipe: atlassian/ssh-run:0.8.1
              variables:
                SSH_USER: ubuntu
                SERVER: $DEV_SERVER_IP
                SSH_KEY: $DEV_SSH_KEY
                COMMAND: bash /home/ubuntu/deploy-frontend.sh
