server {
    listen 80;
    listen [::]:80;
    server_name timeflow-dev.r4ok.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://127.0.0.1:22610/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}
