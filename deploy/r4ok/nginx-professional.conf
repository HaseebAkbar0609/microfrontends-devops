server {
    listen 80;
    listen [::]:80;
    server_name timeflow-dev.r4ok.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timeflow-dev.r4ok.com;

    ssl_certificate /etc/letsencrypt/live/timeflow-dev.r4ok.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timeflow-dev.r4ok.com/privkey.pem;

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_hide_header X-Powered-By;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ (^|/)\. { return 404; }

    location / {
        proxy_pass http://127.0.0.1:22610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
