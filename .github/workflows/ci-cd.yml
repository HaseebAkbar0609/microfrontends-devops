name: TFS Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Linting, Typechecking & Code Quality
  # ==========================================
  quality-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

  # ==========================================
  # Job 2: Kubernetes Manifests Validation
  # ==========================================
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Kind Kubernetes Cluster
        uses: helm/kind-action@v1.12.0

      - name: Apply & Validate Kubernetes Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

  # ==========================================
  # Job 3: Docker Multi-Stage Build & Scan
  # ==========================================
  docker-build:
    name: Build & Scan Docker Images
    needs: [quality-check, k8s-validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer
          - landing
          - professional
          - team
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-contexts: |
            lockfile=.
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.backend.timeflowsystem.com
            NEXT_PUBLIC_API_BASE_URL=https://dev.backend.timeflowsystem.com
          push: false
          load: true
          tags: tfs-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tfs-${{ matrix.app }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
