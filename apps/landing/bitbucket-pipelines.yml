pipelines:
  branches:
    prod_home_pages:
      - step:
          name: Deploy and Run Commands on Production
          script:
            - pipe: atlassian/ssh-run:0.8.1
              variables:
                SSH_USER: $DEPLOY_USER
                SERVER: $PROD_DEPLOY_HOST
                COMMAND: $PROD_DEPLOY_SCRIPT_PATH
                PORT: '22'
                SSH_KEY: $SSH_PRIVATE_KEY
                DEBUG: 'true'
      - step:
          name: Send Notification
          script:
            - ALERT_TYPE="success"
            - if [[ $BITBUCKET_EXIT_CODE -ne 0 ]]; then ALERT_TYPE="Failure" ; fi
            - pipe: atlassian/email-notify:0.13.1
              variables:
                USERNAME: karan.ravat@rlogical.com
                PASSWORD: $password
                FROM: karan.ravat@rlogical.com
                TO: shruti.solanki@rlogical.com, harnish.patel@rlogical.com, karan.ravat@rlogical.com
                HOST: 'smtp.gmail.com'
                PORT: 587
                SUBJECT: '${ALERT_TYPE}:Bitbucket Pipeline Notification for repo ${BITBUCKET_REPO_FULL_NAME} branch ${BITBUCKET_BRANCH}'

    dev_home_pages:
      - step:
          name: Deploy and Run Commands on Production
          script:
            - pipe: atlassian/ssh-run:0.8.1
              variables:
                SSH_USER: $DEPLOY_USER
                SERVER: $DEV_DEPLOY_HOST
                COMMAND: $DEV_DEPLOY_SCRIPT_PATH
                PORT: '22'
                SSH_KEY: $SSH_PRIVATE_KEY
                DEBUG: 'true'
      - step:
          name: Send Notification
          script:
            - ALERT_TYPE="success"
            - if [[ $BITBUCKET_EXIT_CODE -ne 0 ]]; then ALERT_TYPE="Failure" ; fi
            - pipe: atlassian/email-notify:0.13.1
              variables:
                USERNAME: karan.ravat@rlogical.com
                PASSWORD: $password
                FROM: karan.ravat@rlogical.com
                TO: shruti.solanki@rlogical.com, harnish.patel@rlogical.com, karan.ravat@rlogical.com
                HOST: 'smtp.gmail.com'
                PORT: 587
                SUBJECT: '${ALERT_TYPE}:Bitbucket Pipeline Notification for repo ${BITBUCKET_REPO_FULL_NAME} branch ${BITBUCKET_BRANCH}'
