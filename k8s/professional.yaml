apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfs-professional
  namespace: tfs
  labels:
    app: tfs-professional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tfs-professional
  template:
    metadata:
      labels:
        app: tfs-professional
    spec:
      containers:
        - name: professional
          image: tfs-professional:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tfs-professional-service
  namespace: tfs
spec:
  type: NodePort
  selector:
    app: tfs-professional
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30083
